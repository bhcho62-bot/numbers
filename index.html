<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>인지 마스터 - 숫자 기억력 (버튼 제어)</title>
    <style>
        :root { --primary: #339af0; --success: #51cf66; --error: #ff6b6b; --bg: #f8f9fa; --dark: #212529; --mic: #f03e3e; }
        
        body { 
            font-family: 'Pretendard', sans-serif; background: var(--bg); margin: 0; 
            display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden;
        }

        #app { 
            width: 90%; max-width: 420px; height: 90%;
            background: white; border-radius: 32px; 
            box-shadow: 0 25px 50px rgba(0,0,0,0.12); 
            display: flex; flex-direction: column; padding: 30px; box-sizing: border-box; position: relative;
        }

        .info-bar { display: flex; justify-content: space-between; margin-bottom: 20px; font-weight: bold; color: #868e96; font-size: 0.9rem; }
        .life-heart { color: var(--error); }

        .display-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        
        #visual-dot { 
            width: 100px; height: 100px; border-radius: 50%; background: #e9ecef;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; align-items: center; justify-content: center; font-size: 2rem;
            cursor: default;
        }
        .dot-speaking { background: var(--primary) !important; transform: scale(1.1); box-shadow: 0 0 30px rgba(51,154,240,0.4); color: white; }
        
        /* 마이크 버튼 스타일 */
        .mic-btn {
            width: 70px; height: 70px; border-radius: 50%; background: #dee2e6;
            border: none; font-size: 30px; cursor: pointer; transition: 0.3s;
            display: flex; align-items: center; justify-content: center; margin: 10px auto;
        }
        .mic-active { 
            background: var(--mic) !important; color: white; 
            animation: pulse 1.2s infinite; 
        }

        #status-text { font-size: 1.1rem; font-weight: 800; color: var(--dark); margin: 20px 0; min-height: 1.5em; text-align: center; }

        #user-input {
            font-size: 2.2rem; width: 100%; border: none; border-bottom: 3px solid #e9ecef;
            text-align: center; outline: none; margin-bottom: 20px; padding: 5px 0; color: var(--primary); font-weight: 800;
        }

        .main-btn { 
            font-size: 1rem; padding: 15px; cursor: pointer; border: none; 
            border-radius: 18px; background: var(--dark); color: white; 
            font-weight: bold; width: 100%; transition: 0.2s; margin-top: 8px;
        }
        .btn-reverse { background: var(--success); }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(240, 62, 62, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(240, 62, 62, 0); }
            100% { box-shadow: 0 0 0 0 rgba(240, 62, 62, 0); }
        }

        .hidden { display: none !important; }
        .correct { background-color: #ebfbee !important; }
        .wrong { background-color: #fff5f5 !important; }
    </style>
</head>
<body>

<div id="app">
    <div class="info-bar">
        <div>최고 기록: <span id="best-score">0</span></div>
        <div class="life-heart" id="lives">♥♥♥</div>
    </div>

    <div id="setup-screen">
        <h1>숫자 기억력</h1>
        <p style="color:#868e96; margin-bottom:30px;">소리를 듣고 마이크 버튼을 눌러 답변하세요.</p>
        <button class="main-btn" onclick="startGame('normal')">정방향 시작</button>
        <button class="main-btn btn-reverse" onclick="startGame('reverse')">거꾸로 외우기 시작</button>
    </div>

    <div id="game-screen" class="hidden">
        <div class="display-area">
            <div id="visual-dot">?</div>
            <div id="status-text">준비하세요</div>
            
            <div id="input-container" class="hidden" style="width:100%">
                <button id="mic-trigger" class="mic-btn" onclick="toggleMic()">🎤</button>
                <input type="number" id="user-input" inputmode="numeric" placeholder="숫자 입력">
                <button class="main-btn" onclick="checkAnswer()">확인</button>
            </div>
        </div>
    </div>
</div>

<script>
    let currentLength = 3;
    let targetNumbers = [];
    let gameMode = 'normal';
    let life = 3;
    let bestScore = localStorage.getItem('num_best') || 0;
    let isListening = false;
    
    const synth = window.speechSynthesis;
    const dot = document.getElementById('visual-dot');
    const statusText = document.getElementById('status-text');
    const userInput = document.getElementById('user-input');
    const micBtn = document.getElementById('mic-trigger');
    
    document.getElementById('best-score').innerText = bestScore;

    // 음성 인식 초기화
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    
    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'ko-KR';
        recognition.onstart = () => {
            isListening = true;
            micBtn.classList.add('mic-active');
            statusText.innerText = "듣고 있습니다... 말씀하세요";
        };
        recognition.onresult = (e) => {
            const result = e.results[0][0].transcript.replace(/[^0-9]/g, '');
            if(result) {
                userInput.value = result;
            }
        };
        recognition.onend = () => {
            isListening = false;
            micBtn.classList.remove('mic-active');
            statusText.innerText = "입력이 완료되었습니다";
        };
    }

    function toggleMic() {
        if (!recognition) return alert("이 브라우저는 음성 인식을 지원하지 않습니다.");
        if (isListening) {
            recognition.stop();
        } else {
            userInput.value = '';
            recognition.start();
        }
    }

    function startGame(mode) {
        gameMode = mode;
        life = 3;
        currentLength = 3;
        updateLifeUI();
        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        nextRound();
    }

    function updateLifeUI() {
        document.getElementById('lives').innerText = '♥'.repeat(life);
    }

    function nextRound() {
        userInput.value = '';
        document.getElementById('input-container').classList.add('hidden');
        targetNumbers = Array.from({length: currentLength}, () => Math.floor(Math.random() * 10));
        statusText.innerText = `${currentLength}자리를 외우세요`;
        dot.innerText = "?";
        setTimeout(() => speakSequence(0), 1000);
    }

    function speakSequence(idx) {
        if (idx < targetNumbers.length) {
            const utter = new SpeechSynthesisUtterance(targetNumbers[idx].toString());
            utter.lang = 'ko-KR';
            utter.rate = 0.8;
            utter.onstart = () => {
                dot.classList.add('dot-speaking');
                dot.innerText = targetNumbers[idx];
            };
            utter.onend = () => {
                dot.classList.remove('dot-speaking');
                dot.innerText = "";
                setTimeout(() => speakSequence(idx + 1), 400);
            };
            synth.speak(utter);
        } else {
            showInputArea();
        }
    }

    function showInputArea() {
        statusText.innerText = "마이크 버튼을 누르고 말씀하세요";
        dot.innerText = "Ready";
        document.getElementById('input-container').classList.remove('hidden');
    }

    function checkAnswer() {
        if (isListening) recognition.stop();
        const answer = userInput.value;
        if (!answer) return statusText.innerText = "숫자를 입력하거나 말씀해주세요";

        const correctStr = (gameMode === 'reverse') 
            ? [...targetNumbers].reverse().join('') 
            : targetNumbers.join('');

        if (answer === correctStr) {
            handleSuccess();
        } else {
            handleFailure(correctStr);
        }
    }

    function handleSuccess() {
        document.getElementById('app').classList.add('correct');
        statusText.innerText = "정답입니다! 👏";
        if (currentLength > bestScore) {
            bestScore = currentLength;
            localStorage.setItem('num_best', bestScore);
            document.getElementById('best-score').innerText = bestScore;
        }
        setTimeout(() => {
            document.getElementById('app').classList.remove('correct');
            currentLength++;
            nextRound();
        }, 1200);
    }

    function handleFailure(correct) {
        life--;
        updateLifeUI();
        document.getElementById('app').classList.add('wrong');
        if (life <= 0) {
            statusText.innerText = `게임 종료! 정답은 ${correct}`;
            setTimeout(() => {
                alert(`최종 기록: ${currentLength-1}자리\n정답은 [${correct}]였습니다.`);
                location.reload();
            }, 500);
        } else {
            statusText.innerText = `오답입니다! (남은 기회 ${life}번)`;
            setTimeout(() => {
                document.getElementById('app').classList.remove('wrong');
                nextRound();
            }, 1500);
        }
    }
</script>
</body>
</html>
