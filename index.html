<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>인지 마스터 - 숫자 기억력 (자동 음성 인식)</title>
    <style>
        :root { --primary: #1c7ed6; --success: #51cf66; --error: #f03e3e; --bg: #f1f3f5; --mic: #f03e3e; }
        
        body { 
            font-family: 'Pretendard', sans-serif; 
            background: var(--bg); 
            margin: 0; 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; overflow: hidden;
        }

        #app { 
            width: 90%; max-width: 420px; height: 85%;
            background: white; border-radius: 30px; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.1); 
            display: flex; flex-direction: column; 
            padding: 30px; box-sizing: border-box; text-align: center;
        }

        .training-tip { 
            background: #fff9db; color: #f08c00; 
            padding: 10px; border-radius: 12px; 
            font-size: 14px; font-weight: bold; margin-bottom: 15px;
        }

        #visual-cue-game { 
            width: 70px; height: 70px; border-radius: 50%; 
            background-color: #f1f3f5; margin: 15px auto 30px; 
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            border: 5px solid #fff; box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
        }
        .speaking { 
            background-color: var(--primary) !important; 
            transform: scale(1.2); 
            box-shadow: 0 0 25px rgba(28, 126, 214, 0.4) !important; 
        }

        #status-display { 
            font-size: 18px; margin-bottom: 20px; 
            color: var(--primary); font-weight: bold; min-height: 28px; 
        }

        .input-container { width: 100%; margin-bottom: 20px; }
        input { 
            font-size: 32px; width: 100%; padding: 15px; 
            border: 3px solid #e9ecef; border-radius: 18px; 
            text-align: center; outline: none; background: #f8f9fa; 
            box-sizing: border-box;
        }

        .mic-indicator {
            display: inline-flex; align-items: center; justify-content: center;
            width: 60px; height: 60px; border-radius: 50%;
            background: #dee2e6; font-size: 24px; margin-bottom: 10px;
            transition: 0.3s;
        }
        .mic-active { 
            background: var(--mic); color: white; 
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(240, 62, 62, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 15px rgba(240, 62, 62, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(240, 62, 62, 0); }
        }

        button.main-btn { 
            font-size: 18px; padding: 18px; cursor: pointer; border: none; 
            border-radius: 18px; background: var(--primary); color: white; 
            font-weight: bold; width: 100%; transition: 0.2s; margin-top: 10px;
        }
        .hidden { display: none !important; }
        .correct-flash { background-color: #ebfbee !important; }
        .wrong-flash { background-color: #fff5f5 !important; }
    </style>
</head>
<body>

<div id="app">
    <div class="training-tip">💡 문제 종료 1초 후 자동으로 마이크가 켜집니다</div>
    
    <div id="setup-screen">
        <h1>숫자 기억력 테스트</h1>
        <p style="color:#868e96">들려주는 숫자를 잘 기억하세요.</p>
        <div id="visual-cue-game" style="margin: 40px auto;"></div>
        <button class="main-btn" onclick="startGame('normal')">정방향 시작</button>
        <button class="main-btn" style="background:#51cf66" onclick="startGame('reverse')">거꾸로 시작</button>
    </div>

    <div id="game-screen" class="hidden">
        <h1 id="mode-title">훈련 중</h1>
        <div id="status-display">준비 중...</div>
        <div id="visual-cue-display" class="speaking-dot" style="width:20px; height:20px; border-radius:50%; background:#f1f3f5; margin:0 auto 20px;"></div>
        
        <div id="input-area" class="hidden">
            <div id="mic-icon" class="mic-indicator">🎤</div>
            <div class="input-container">
                <input type="number" id="user-input" inputmode="numeric" placeholder="듣는 중...">
            </div>
            <button class="main-btn" onclick="checkAnswer()">확인</button>
        </div>
    </div>
</div>

<script>
    let currentLength = 3;
    let targetNumbers = [];
    let gameMode = 'normal';
    let reverseCount = 0;
    const synth = window.speechSynthesis;
    const app = document.getElementById('app');

    // 음성 인식 초기화
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isRecognizing = false;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'ko-KR';
        recognition.interimResults = false;

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            const cleaned = transcript.replace(/[^0-9]/g, '');
            if (cleaned) {
                document.getElementById('user-input').value = cleaned;
                setTimeout(checkAnswer, 800); // 번호 입력 후 자동 확인
            }
        };

        recognition.onend = () => {
            isRecognizing = false;
            document.getElementById('mic-icon').classList.remove('mic-active');
        };
    }

    function startSpeechAuto() {
        if (!recognition) return;
        if (isRecognizing) return;

        isRecognizing = true;
        recognition.start();
        document.getElementById('mic-icon').classList.add('mic-active');
        document.getElementById('status-display').innerText = "지금 바로 말씀하세요!";
    }

    function startGame(mode) {
        gameMode = mode;
        currentLength = 3;
        reverseCount = 0;
        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        nextRound();
    }

    function nextRound() {
        document.getElementById('status-display').innerText = `${currentLength}자리를 들려드립니다.`;
        document.getElementById('input-area').classList.add('hidden');
        document.getElementById('user-input').value = '';
        targetNumbers = Array.from({length: currentLength}, () => Math.floor(Math.random() * 10));
        speakNumbers(targetNumbers);
    }

    function speakNumbers(nums) {
        let index = 0;
        const dot = document.getElementById('visual-cue-display');
        
        function speak() {
            if (index < nums.length) {
                const utter = new SpeechSynthesisUtterance(nums[index].toString());
                utter.lang = 'ko-KR';
                utter.rate = 0.8;
                utter.onstart = () => dot.style.background = "var(--primary)";
                utter.onend = () => {
                    dot.style.background = "#f1f3f5";
                    index++;
                    setTimeout(speak, 500);
                };
                synth.speak(utter);
            } else {
                // 핵심 기능: 음성 출력 종료 후 1초 뒤 자동 음성인식 시작
                document.getElementById('status-display').innerText = "잠시만 기다리세요...";
                document.getElementById('input-area').classList.remove('hidden');
                setTimeout(startSpeechAuto, 1000); 
            }
        }
        setTimeout(speak, 1000);
    }

    function checkAnswer() {
        if (isRecognizing) recognition.stop();
        
        const inputField = document.getElementById('user-input');
        let answer = inputField.value;
        if (!answer) return;

        let correctAnswer = (gameMode === 'reverse') 
            ? [...targetNumbers].reverse().join('') 
            : targetNumbers.join('');

        if (answer === correctAnswer) {
            app.classList.add('correct-flash');
            setTimeout(() => {
                app.classList.remove('correct-flash');
                if (gameMode === 'reverse') {
                    reverseCount++;
                    if (reverseCount >= 3) { currentLength++; reverseCount = 0; }
                } else {
                    currentLength++;
                }
                nextRound();
            }, 600);
        } else {
            app.classList.add('wrong-flash');
            setTimeout(() => {
                alert(`오답입니다!\n정답: ${correctAnswer}\n내 대답: ${answer}`);
                location.reload();
            }, 200);
        }
    }
</script>
</body>
</html>
